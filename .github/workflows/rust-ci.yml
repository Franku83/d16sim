name: rust-ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Build (locked, offline-safe after prefetch)
        run: cargo build --locked --workspace
      - name: Tests (no network at test time)
        run: cargo test --locked --workspace -- --test-threads=4
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Schema validation against S01 data
        run: cargo run --locked -p d16sim -- validate-data --data-dir data
      - name: Determinism self-test
        run: |
          cargo run --locked -p d16sim -- init --manifest target/ci-manifest.json
          cargo run --locked -p d16sim -- run-scenario --manifest target/ci-manifest.json --out target/ci-run
          cargo run --locked -p d16sim -- replay --manifest target/ci-manifest.json --run-dir target/ci-run
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (no unwrap in production paths)
        run: cargo clippy --locked --workspace --all-targets -- -D clippy::unwrap_used
