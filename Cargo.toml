[workspace]
members = [
    "crates/engine-types",
    "crates/math",
    "crates/units",
    "crates/assembly",
    "crates/kinematics",
    "crates/contacts",
    "crates/fastener",
    "crates/thermo",
    "crates/combustion",
    "crates/valvetrain",
    "crates/flow",
    "crates/fuel",
    "crates/crank",
    "crates/electrical",
    "crates/engine",
    "crates/trigger",
    "crates/ecu",
    "crates/diagnostics",
    "crates/thermal",
    "crates/lube",
    "crates/leak",
    "crates/calibration",
    "crates/wear",
    "crates/physics",
    "crates/simulation",
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.99.0"

[workspace.lints.clippy]
unwrap_used = "deny"
missing_errors_doc = "warn"
